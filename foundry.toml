[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Liveness-variant experiments (not part of the reference suite):
#   FOUNDRY_PROFILE=experiments forge test
[profile.experiments]
src = "src"
test = "experiments/test"
out = "out-experiments"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
